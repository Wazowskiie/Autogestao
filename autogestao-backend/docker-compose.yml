services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autogestao
      POSTGRES_PASSWORD: autogestao_dev
      POSTGRES_DB: autogestao_dev
    ports:
      - "5432:5432"
    volumes:
      - autogestao_pg_data:/var/lib/postgresql/data

volumes:
  autogestao_pg_data:
